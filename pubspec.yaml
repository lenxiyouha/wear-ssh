name: wear_ssh
description: "圆表SSH：适配圆形表盘 Wear OS 的 SSH 客户端，支持服务器信息查看、SFTP 文件管理（上传/下载）与远程终端。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # 纯 Dart 实现的 SSH / SFTP 客户端
  dartssh2: ^4.1.0
  # 服务器配置本地持久化
  shared_preferences: ^2.5.0
  # 下载/上传进度回调用的路径提供器
  path_provider: ^2.1.5
  # 从系统文件选择器挑选待上传文件
  file_picker: ^10.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # 应用图标生成（读取 assets/icon/icon_source.png）
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon_source.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: false
  project_type: flutter
